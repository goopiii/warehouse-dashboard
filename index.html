<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>물류센터 현황판</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'맑은 고딕',sans-serif;background:#f0f2f5;min-height:100vh}

/* 헤더 */
.header{background:#111827;padding:10px 24px;display:flex;justify-content:space-between;align-items:center}
.header-left{display:flex;align-items:center;gap:12px}
.center-badge{background:#1d4ed8;color:#bfdbfe;font-size:12px;font-weight:700;padding:4px 12px;border-radius:6px}
.header-title{font-size:15px;font-weight:700;color:#f9fafb}
.header-right{display:flex;align-items:center;gap:12px}
.header-time{font-size:13px;color:#9ca3af}
.refresh-badge{font-size:11px;color:#6b7280;background:#1f2937;padding:3px 10px;border-radius:4px}

.content{padding:14px;display:flex;flex-direction:column;gap:12px}

/* ── 섹션1: 예측/목표 ── */
.section-forecast{background:#111827;border-radius:10px;padding:16px 22px;display:flex;align-items:center;gap:0}
.fc-main{flex:0 0 auto;margin-right:32px}
.fc-label{font-size:15px;color:#fff;font-weight:700;margin-bottom:6px}
.fc-value{font-size:48px;font-weight:700;color:#fff;line-height:1}
.fc-sub{font-size:14px;color:#fff;margin-top:5px;font-weight:700}
.fc-divider{width:1px;background:#374151;height:70px;margin-right:32px;flex-shrink:0}
.fc-progress{flex:1}
.fc-progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.fc-current-label{font-size:15px;color:#fff;font-weight:700}
.fc-current-value{font-size:36px;font-weight:700;color:#60a5fa}
.fc-pct{font-size:28px;font-weight:700;color:#34d399}
.fc-bar-wrap{background:#1f2937;border-radius:6px;height:16px;overflow:hidden;margin-bottom:8px}
.fc-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#1d4ed8,#3b82f6);transition:width .8s ease}
.fc-bar-bottom{display:flex;justify-content:space-between}
.fc-remain{font-size:14px;color:#fff;font-weight:700}
.fc-stats{display:flex;gap:24px;margin-left:32px;flex-shrink:0}
.fc-stat{text-align:center}
.fc-stat-label{font-size:13px;color:#9ca3af;font-weight:700;margin-bottom:4px}
.fc-stat-value{font-size:20px;font-weight:700;color:#fff}

/* ── 섹션2: 진행현황 ── */
.section-progress{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.prog-card{background:#fff;border-radius:8px;padding:12px 14px;border:0.5px solid #e5e7eb}
.prog-card.highlight-blue{border:1.5px solid #bfdbfe;background:#eff6ff}
.prog-card.highlight-red{border:1.5px solid #fecaca;background:#fff7f7}
.prog-label{font-size:13px;font-weight:700;color:#111827;margin-bottom:6px}
.prog-label.red{color:#dc2626}
.prog-label.blue{color:#1d4ed8}
.prog-value{font-size:26px;font-weight:700;color:#111827;line-height:1.1}
.prog-value.blue{color:#1d4ed8}
.prog-value.red{color:#dc2626}
.prog-value.amber{color:#d97706}
.prog-value.green{color:#059669}
.prog-pct{font-size:13px;font-weight:700;color:#111827;margin-top:4px}
.pbar-wrap{background:#f3f4f6;border-radius:4px;height:5px;margin-top:6px;overflow:hidden}
.pbar-fill{height:100%;border-radius:4px}

/* ── 섹션3: 구역별 ── */
.section-floors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.floor-group{background:#fff;border-radius:10px;overflow:hidden;border:0.5px solid #e5e7eb}
.floor-group-header{background:#111827;padding:8px 16px;font-size:13px;font-weight:700;color:#f9fafb}
.floor-table-head{display:grid;grid-template-columns:44px repeat(3,1fr);padding:8px 16px;background:#f9fafb;border-bottom:0.5px solid #e5e7eb}
.floor-th{text-align:right;font-size:14px;font-weight:700;color:#111827}
.floor-row{display:grid;grid-template-columns:44px repeat(3,1fr);padding:12px 16px;border-top:0.5px solid #f3f4f6;align-items:start}
.floor-row:hover{background:#fafafa}
.floor-name{font-size:18px;font-weight:700;color:#111827;padding-top:4px}
.floor-cell{text-align:right}
.floor-unfinished{font-size:16px;font-weight:700;margin-bottom:3px}
.floor-done{font-size:16px;font-weight:700;color:#111827}
.floor-pct{font-size:20px;font-weight:700;color:#111827;margin:2px 0}
.floor-bar-wrap{background:#f3f4f6;border-radius:3px;height:5px;overflow:hidden;margin-top:3px}
.floor-bar-fill{height:100%;border-radius:3px}

.loading{text-align:center;padding:60px;color:#9ca3af;font-size:14px}
.error-msg{background:#fee2e2;color:#991b1b;padding:12px 16px;border-radius:8px;font-size:13px;font-weight:700}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <select id="center-select" onchange="onCenterChange(this.value)" style="background:#1d4ed8;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;outline:none">
      <option value="NWH01">신여주1</option>
      <option value="NWH02">신여주2</option>
      <option value="NWH03">신여주3</option>
      <option value="YEJ04">신여주4</option>
      <option value="ANS01">안성1</option>
    </select>
    <span class="header-title" id="center-title">신여주1센터 B2C 출고 현황판</span>
  </div>
  <div class="header-right" style="display:flex;align-items:center;gap:12px">
    <div style="display:flex;align-items:center;gap:6px">
      <input type="date" id="date-select"
        style="background:#1f2937;color:#fff;border:1px solid #374151;border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;outline:none"
        onchange="onDateChange(this.value)">
      <button onclick="resetToToday()"
        style="background:#374151;color:#9ca3af;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer">
        오늘
      </button>
    </div>
    <span class="refresh-badge" id="next-refresh">다음 갱신: 10분 후</span>
    <span class="header-time" id="clock"></span>
  </div>
</div>

<div class="content">
  <!-- 섹션1: 예측/목표 -->
  <div class="section-forecast" id="forecast-section">
    <div class="fc-main">
      <div class="fc-label">오늘 예측치</div>
      <div class="fc-value" id="fc-value">-</div>
      <div class="fc-sub">M1P 기준</div>
    </div>
    <div class="fc-divider"></div>
    <div class="fc-progress">
      <div class="fc-progress-top">
        <span class="fc-current-label">현재 주문수량</span>
        <span class="fc-pct" id="fc-pct">- %</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:8px">
        <span class="fc-current-value" id="fc-current">-</span>
        <span style="font-size:16px;color:#fff;font-weight:700">PCS</span>
      </div>
      <div class="fc-bar-wrap">
        <div class="fc-bar-fill" id="fc-bar" style="width:0%"></div>
      </div>
      <div class="fc-bar-bottom">
        <span class="fc-remain" id="fc-remain">잔여: -</span>
        <span style="font-size:14px;color:#fff;font-weight:700" id="fc-updated"></span>
      </div>
    </div>

  </div>

  <!-- 섹션2: 진행현황 -->
  <div class="section-progress" id="progress-section">
    <div class="loading">데이터 불러오는 중...</div>
  </div>

  <!-- 섹션3: 구역별 -->
  <div class="section-floors" id="floors-section">
    <div class="loading">데이터 불러오는 중...</div>
  </div>
</div>

<script>
const fmt = n => n == null ? '-' : Number(n).toLocaleString();
const pct = (v, t) => t > 0 ? Math.round(v / t * 100) : 0;
let lastUpdated = '-';

async function loadForecast() {
  try {
    const res = await fetch('/api/forecast?center=' + currentCenter + '&date=' + currentDate);
    const d = await res.json();
    if (d.status !== 'ok') return;
    const f = d.forecast || {};
    const totalQty = Number(d.total_qty || 0);
    const fcst = Number(f.fcst_total || 0);
    const p = pct(totalQty, fcst);

    document.getElementById('fc-value').textContent = fmt(fcst);
    document.getElementById('fc-current').textContent = fmt(totalQty);
    document.getElementById('fc-pct').textContent = p + '%';
    document.getElementById('fc-bar').style.width = Math.min(p, 100) + '%';
    document.getElementById('fc-remain').textContent = '잔여: ' + fmt(fcst - totalQty) + ' PCS';
    document.getElementById('fc-yoy').textContent = fmt('-');
    document.getElementById('fc-wow').textContent = fmt('-');
  } catch(e) {
    console.error('forecast error', e);
  }
}

async function loadB2C() {
  try {
    const res = await fetch('/api/b2c?center=' + currentCenter + '&date=' + currentDate);
    const d = await res.json();
    if (d.last_updated) lastUpdated = d.last_updated;
    document.getElementById('fc-updated').textContent = '기준: ' + lastUpdated;

    const s = d.summary || {};
    const floors = d.floors || [];
    const totalQty = Number(s.total_qty || 0);
    const allocQty = Number(s.alloc_qty || 0);
    const pickQty  = Number(s.pick_qty  || 0);
    const packQty  = Number(s.pack_qty  || 0);
    const unalloc  = totalQty - allocQty;
    const unpick   = allocQty - pickQty;
    const unpack   = allocQty - packQty;

    // 섹션2: 진행현황
    document.getElementById('progress-section').innerHTML = `
      <div class="prog-card">
        <div class="prog-label" style="color:#111827">총 주문수량</div>
        <div class="prog-value" style="color:#111827">${fmt(totalQty)}</div>
        <div style="font-size:11px;color:#9ca3af;margin-top:4px">당일 무배당발 기준</div>
      </div>
      <div class="prog-card highlight-blue">
        <div class="prog-label" style="color:#111827">할당완료</div>
        <div class="prog-value" style="color:#111827">${fmt(allocQty)}</div>
        <div class="pbar-wrap"><div class="pbar-fill" style="width:${pct(allocQty,totalQty)}%;background:#1d4ed8"></div></div>
        <div class="prog-pct" style="font-size:20px;color:#111827">${pct(allocQty,totalQty)}%</div>
      </div>
      <div class="prog-card highlight-red">
        <div class="prog-label red">미할당</div>
        <div class="prog-value red">${fmt(unalloc)}</div>
        <div class="pbar-wrap"><div class="pbar-fill" style="width:${pct(unalloc,totalQty)}%;background:#dc2626"></div></div>
        <div class="prog-pct" style="font-size:20px;color:#dc2626">${pct(unalloc,totalQty)}%</div>
      </div>
      <div class="prog-card">
        <div class="prog-label" style="color:#111827">피킹완료</div>
        <div class="prog-value" style="color:#111827">${fmt(pickQty)}</div>
        <div class="pbar-wrap"><div class="pbar-fill" style="width:${pct(pickQty,allocQty)}%;background:#d97706"></div></div>
        <div class="prog-pct" style="font-size:20px;color:#111827">${pct(pickQty,allocQty)}%</div>
      </div>
      <div class="prog-card highlight-red">
        <div class="prog-label red">미피킹</div>
        <div class="prog-value red">${fmt(unpick)}</div>
        <div class="pbar-wrap"><div class="pbar-fill" style="width:${pct(unpick,allocQty)}%;background:#dc2626"></div></div>
        <div class="prog-pct" style="font-size:20px;color:#dc2626">${pct(unpick,allocQty)}%</div>
      </div>
      <div class="prog-card">
        <div class="prog-label" style="color:#111827">패킹완료</div>
        <div class="prog-value" style="color:#111827">${fmt(packQty)}</div>
        <div class="pbar-wrap"><div class="pbar-fill" style="width:${pct(packQty,allocQty)}%;background:#059669"></div></div>
        <div class="prog-pct" style="font-size:20px;color:#111827">${pct(packQty,allocQty)}%</div>
      </div>
      <div class="prog-card highlight-red">
        <div class="prog-label red">미패킹</div>
        <div class="prog-value red">${fmt(unpack)}</div>
        <div class="pbar-wrap"><div class="pbar-fill" style="width:${pct(unpack,allocQty)}%;background:#dc2626"></div></div>
        <div class="prog-pct" style="font-size:20px;color:#dc2626">${pct(unpack,allocQty)}%</div>
      </div>
    `;

    // 섹션3: 구역별 — API에서 받은 dongs 구성으로 동적 렌더링
    const dongs = d.dongs || {"A동": [], "B동": []};
    const floorMap = {};
    floors.forEach(f => { floorMap[f.floor] = f; });
    const floorsByDong = {};
    Object.keys(dongs).forEach(dongName => {
      floorsByDong[dongName] = dongs[dongName]
        .filter(code => floorMap[code])
        .map(code => floorMap[code]);
    });

    const floorBar = (fillPct, color, doneVal, label) => `
      <div style="text-align:right">
        <span style="font-size:36px;font-weight:700;color:#111827">${doneVal}</span>
      </div>`;

    const renderRows = (rows) => rows.map(r => {
      const tot    = Number(r.total_qty||0);
      const al     = Number(r.alloc_qty||0);
      const pi     = Number(r.pick_qty||0);
      const pa     = Number(r.pack_qty||0);
      const unpick = Number(r.unpick_qty||0);
      const unpack = Number(r.unpack_qty||0);
      const floorLabel = {'A1':'A동\n1층','A2':'A동\n2층','A3':'A동\n3층','B1':'B동\n1층','B2':'B동\n2층','B3':'B동\n3층'};
      return `
        <div class="floor-row">
          <span class="floor-name" style="font-size:20px;white-space:pre-line;line-height:1.3">${floorLabel[r.floor]||r.floor}</span>
          <div class="floor-cell">
            <div style="text-align:right;font-size:28px;font-weight:700;color:#111827;margin-bottom:4px">${fmt(al)}</div>
            <div style="text-align:right;font-size:42px;font-weight:700;color:${(tot-al)>0?'#dc2626':'#d1d5db'}">${fmt(tot-al)} 미할당</div>
          </div>
          <div class="floor-cell">
            <div style="text-align:right;font-size:28px;font-weight:700;color:#111827;margin-bottom:4px">${fmt(pi)}</div>
            <div style="text-align:right;font-size:42px;font-weight:700;color:${unpick>0?'#dc2626':'#d1d5db'}">${fmt(unpick)} 미피킹</div>
          </div>
          <div class="floor-cell">
            <div style="text-align:right;font-size:28px;font-weight:700;color:#111827;margin-bottom:4px">${fmt(pa)}</div>
            <div style="text-align:right;font-size:42px;font-weight:700;color:${unpack>0?'#dc2626':'#d1d5db'}">${fmt(unpack)} 미패킹</div>
          </div>
        </div>`;
    }).join('');

    const tableHead = `
      <div class="floor-table-head">
        <span></span>
        <span class="floor-th" style="font-size:28px">할당</span>
        <span class="floor-th" style="font-size:28px">피킹</span>
        <span class="floor-th" style="font-size:28px">패킹</span>
      </div>`;

    const dongNames = Object.keys(floorsByDong).filter(d => floorsByDong[d].length > 0);
    const dongCols = dongNames.length === 1 ? '1fr' : '1fr 1fr';
    document.getElementById('floors-section').style.gridTemplateColumns = dongCols;
    document.getElementById('floors-section').innerHTML = dongNames.map(dongName => `
      <div class="floor-group">
        <div class="floor-group-header">${dongName}</div>
        ${tableHead}${renderRows(floorsByDong[dongName])}
      </div>`).join('');
  } catch(e) {
    document.getElementById('progress-section').innerHTML = `<div class="error-msg">데이터 로드 실패: ${e.message}</div>`;
  }
}

function tick() {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent =
    `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}  ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}

let nextRefreshSec = 600;
function refreshCountdown() {
  nextRefreshSec--;
  if (nextRefreshSec <= 0) { nextRefreshSec = 600; loadAll(); }
  const m = Math.floor(nextRefreshSec/60);
  const s = nextRefreshSec%60;
  document.getElementById('next-refresh').textContent = `다음 갱신: ${m}분 ${String(s).padStart(2,'0')}초 후`;
}

let currentCenter = 'NWH01';
let currentDate = new Date().toISOString().slice(0,10);  // 오늘 날짜로 초기화

function onDateChange(date) {
  currentDate = date;
  // 날짜 무관하게 자동갱신 항상 유지
  nextRefreshSec = 600;
  document.getElementById('progress-section').innerHTML = '<div class="loading">데이터 불러오는 중...</div>';
  document.getElementById('floors-section').innerHTML = '<div class="loading">데이터 불러오는 중...</div>';
  loadAll();
}

function resetToToday() {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('date-select').value = today;
  currentDate = today;
  nextRefreshSec = 600;
  loadAll();
}

const CENTER_TITLES = {
  'NWH01': '신여주1센터',
  'NWH02': '신여주2센터',
  'NWH03': '신여주3센터',
  'YEJ04': '신여주4센터',
  'ANS01': '안성1센터',
};

function onCenterChange(code) {
  currentCenter = code;
  document.getElementById('center-title').textContent = CENTER_TITLES[code] + ' B2C 출고 현황판';
  document.getElementById('progress-section').innerHTML = '<div class="loading">데이터 불러오는 중...</div>';
  document.getElementById('floors-section').innerHTML = '<div class="loading">데이터 불러오는 중...</div>';
  document.getElementById('fc-value').textContent = '-';
  document.getElementById('fc-current').textContent = '-';
  document.getElementById('fc-pct').textContent = '- %';
  document.getElementById('fc-bar').style.width = '0%';
  document.getElementById('fc-remain').textContent = '잔여: -';
  nextRefreshSec = 600;
  loadAll();
}

function loadAll() { loadForecast(); loadB2C(); }
// 날짜 선택기 오늘로 초기화
const todayStr = new Date().toISOString().slice(0,10);
document.getElementById('date-select').value = todayStr;
currentDate = todayStr;

loadAll();
tick(); setInterval(tick,1000);
setInterval(refreshCountdown,1000);
</script>
</body>
</html>
